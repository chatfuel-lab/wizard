# Static analysis of the workflows themselves: unpinned actions, injectable
# expressions, over-broad permissions, credentials left in the checkout.
name: Workflow analysis

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          inputs: .github/
          min-severity: medium
          advanced-security: false
