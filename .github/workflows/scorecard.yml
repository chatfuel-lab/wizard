# OpenSSF Scorecard: supply-chain posture, as code scanning alerts and nothing
# else. Meaningful only on a public repository.
#
# `publish_results` is off, so the score stays in this repository's Security tab
# instead of going to the public OpenSSF dataset. That upload is also the only
# reason the job would need `id-token: write`, so it does not have it.
name: Scorecard

on:
  branch_protection_rule:
  # Runnable by hand, so the first score is read before the repository is
  # announced rather than after.
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 2'
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Analyze
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
