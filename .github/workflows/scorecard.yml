# OpenSSF Scorecard: supply-chain posture, as code scanning alerts and nothing
# else. Meaningful only on a public repository.
#
# `publish_results` is off, so the score stays in this repository's Security tab
# instead of going to the public OpenSSF dataset. That upload is also the only
# reason the job would need `id-token: write`, so it does not have it.
name: Scorecard

on:
  branch_protection_rule:
  # Runnable by hand, so the first score is read before the repository is
  # announced rather than after.
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 2'
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Analyze
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
