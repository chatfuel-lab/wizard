name: Dependency review

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Everything this repository ships is MIT, and it vendors its own
          # dependencies into other people's projects - a copyleft transitive
          # dependency would travel with them.
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0
          # No `comment-summary-in-pr`: a pull request from a fork is reviewed
          # with a read-only token, so the comment never appears where it would
          # matter most, and asking for it costs `pull-requests: write` on every
          # run. The failed check and its log say the same thing.
