version: 2
updates:
  # One grouped pull request a week for the whole workspace. Ungrouped, a
  # monorepo this size produces a wall of them and they stop being read.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # graphql 17 needs @graphql-codegen 7, whose output the hoist pass in
      # content/codegen does not understand yet. Both move together, by hand.
      - dependency-name: graphql
        update-types: ['version-update:semver-major']
      - dependency-name: '@graphql-codegen/*'
        update-types: ['version-update:semver-major']
      # typescript 7 is the Go port, and it ships no compiler API: the
      # design-classnames validate pass builds an AST with ts.createSourceFile
      # and forEachChild, neither of which it exports.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      production:
        dependency-type: production
        patterns: ['*']
      development:
        dependency-type: development
        patterns: ['*']
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
    labels: ['dependencies']

  # Actions are pinned by commit sha, which no human is going to bump by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    labels: ['dependencies', 'area: ci']
