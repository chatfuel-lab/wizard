# Chatfuel GraphQL — live chat operations (chatfuel-livechat skill).
# Validate against ../chatfuel-core/references/schema.graphql
# (node ../chatfuel-core/scripts/validate-operations.mjs). Usage notes: references/guide.md.

# ============================================================
# Shared fragments
# ============================================================

fragment FileInfo on File {
  id
  url
  type
  status
  size
}

fragment SenderInfo on MessageSender {
  __typename
  id
  name
  profilePicture {
    ...FileInfo
  }
}

# Base fields shared by every concrete Message type.
fragment MessageCommon on Message {
  __typename
  id
  clientId
  sentTime
  updatedAt
  sender {
    ...SenderInfo
  }
  errors {
    code
    date
    originalErrCode
    originalErrMessage
  }
}

# Per-platform message payloads. Field names are platform-prefixed on
# purpose — delivery state is `whatsappStatus` on the WhatsApp types,
# `status` on the widget types, `instagramStatus` / `facebookStatus` /
# `tiktokStatus` on the other three — so never assume a field exists on
# every Message implementer: read a field only under a check on the
# concrete `__typename`. Every concrete type the schema can put in a thread
# is selected here with everything a bubble needs; the Placeholder and
# Unknown types have no payload fields at all.
#
# NOTE: there is no template NAME on the wire. `WhatsAppOutTemplateMessage`
# carries the rendered header/body/footer/buttons and nothing that says
# which template produced them.
fragment WhatsAppMessageParts on Message {
  ... on WhatsAppInTextMessage {
    text
  }
  ... on WhatsAppInImageMessage {
    caption
    file {
      ...FileInfo
    }
  }
  ... on WhatsAppInVideoMessage {
    caption
    file {
      ...FileInfo
    }
  }
  ... on WhatsAppInAudioMessage {
    file {
      ...FileInfo
    }
    transcriptionStatus
    transcribedText
  }
  ... on WhatsAppInDocumentMessage {
    caption
    fileName
    file {
      ...FileInfo
    }
  }
  # The contact tapped something rather than writing.
  ... on WhatsAppInContinueFlowButtonClickMessage {
    buttonTitle
  }
  ... on WhatsAppInTemplateQuickReplyButtonClickMessage {
    buttonTitle
  }
  ... on WhatsAppInListRowClickMessage {
    rowTitle
    rowDescription
  }
  # Every outbound WhatsApp type carries whatsappStatus; select it wherever
  # the type is selected at all, or the bubble shows a time and no ticks.
  ... on WhatsAppOutTextMessage {
    text
    whatsappStatus
  }
  ... on WhatsAppOutImageMessage {
    whatsappStatus
    caption
    file {
      ...FileInfo
    }
  }
  ... on WhatsAppOutVideoMessage {
    whatsappStatus
    caption
    file {
      ...FileInfo
    }
  }
  ... on WhatsAppOutAudioMessage {
    whatsappStatus
    file {
      ...FileInfo
    }
  }
  ... on WhatsAppOutDocumentMessage {
    whatsappStatus
    caption
    fileName
    file {
      ...FileInfo
    }
  }
  # Message-side button types (WhatsApp*MessageButton, plain strings) are
  # NOT the flow-builder button types (WhatsAppButton union, TemplateStr).
  ... on WhatsAppOutTextAndButtonsMessage {
    whatsappStatus
    headerText
    bodyText
    footerText
    whatsappButtons {
      __typename
      title
      ... on WhatsAppOpenURLMessageButton {
        url
      }
    }
  }
  ... on WhatsAppOutTextAndURLMessage {
    whatsappStatus
    headerText
    bodyText
    footerText
    whatsappButtons {
      __typename
      title
      ... on WhatsAppOpenURLMessageButton {
        url
      }
    }
  }
  ... on WhatsAppOutListMessage {
    whatsappStatus
    bodyText
    buttonTitle
    listRows {
      title
      description
    }
  }
  ... on WhatsAppOutTemplateMessage {
    whatsappStatus
    header {
      __typename
      ... on WhatsAppOutTemplateMessageComponentText {
        text
      }
      ... on WhatsAppOutTemplateMessageComponentImage {
        file {
          ...FileInfo
        }
      }
      ... on WhatsAppOutTemplateMessageComponentVideo {
        file {
          ...FileInfo
        }
      }
      ... on WhatsAppOutTemplateMessageComponentDocument {
        file {
          ...FileInfo
        }
        fileName
      }
    }
    body {
      ... on WhatsAppOutTemplateMessageComponentText {
        text
      }
    }
    footer {
      ... on WhatsAppOutTemplateMessageComponentText {
        text
      }
    }
    waTemplateButtons {
      __typename
      ... on WhatsAppOutTemplateMessageURLButton {
        text
        url
      }
      ... on WhatsAppOutTemplateMessageQuickReplyButton {
        text
      }
      ... on WhatsAppOutTemplateMessageCallPhoneButton {
        text
        phoneNumber
      }
      ... on WhatsAppOutTemplateMessageWhatsAppCallButton {
        text
      }
      ... on WhatsAppOutTemplateMessageCopyCodeButton {
        text
        code
      }
    }
  }
}

# No In/Out prefix on this platform: a widget message's direction is on
# `sender.__typename` and nowhere else. `status` is the delivery field.
fragment WebWidgetMessageParts on Message {
  ... on WebWidgetTextMessage {
    text
    status
  }
  # `WebWidgetAttachmentType` has one member, `image`.
  ... on WebWidgetAttachmentMessage {
    status
    attachment {
      type
      file {
        ...FileInfo
      }
    }
  }
  ... on WebWidgetTextAndButtonsMessage {
    status
    text
    buttons {
      __typename
      title
      ... on WebWidgetOpenURLButton {
        url
      }
      ... on WebWidgetCallPhoneButton {
        phone
      }
    }
  }
  ... on WebWidgetContinueFlowButtonClickMessage {
    status
    button {
      title
    }
  }
  ... on WebWidgetOpenURLButtonClickMessage {
    status
    button {
      title
      url
    }
  }
  ... on WebWidgetCallPhoneButtonClickMessage {
    status
    button {
      title
      phone
    }
  }
}

# `instagramStatus` on every Out type; InstagramMessageStatus is
# Sending | Sent | Read | Failed (no Delivered). A comment arrives with the
# media it was left on under `mediaContainer` — the flat `post` / `reel` /
# The flat `ad` / `story` fields are not in this schema — read the media container.
fragment InstagramMediaSource on InstagramMediaContainer {
  id
  media {
    __typename
    ... on InstagramPost {
      isUnknown
      caption
      ownerUsername
      url
      thumbnailPreview {
        ...FileInfo
      }
    }
    ... on InstagramReel {
      isUnknown
      caption
      ownerUsername
      url
      thumbnailPreview {
        ...FileInfo
      }
    }
    ... on InstagramAd {
      isUnknown
      caption
      ownerUsername
      url
      thumbnailPreview {
        ...FileInfo
      }
    }
    ... on InstagramStory {
      isUnknown
      caption
      ownerUsername
      url
      thumbnailPreview {
        ...FileInfo
      }
    }
  }
}

