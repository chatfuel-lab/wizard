fragment AssigneeInfo on ContactAssignee {
  __typename
  ... on PublicUserAccount {
    id
    name
    isUnknown
    profilePicture {
      ...FileInfo
    }
  }
  ... on FuelyAIAssignee {
    fakeField
  }
}

# __typename on Contact and Conversation is REQUIRED — without it fields come back missing.
fragment ChatListContact on Contact {
  __typename
  id
  name
  profilePictureUrl
  updatedAt
  unreadMessagesCount
  unhandledSwitchToHuman
  lastConversationMessageTime
  salesStageV2
  assignee {
    ...AssigneeInfo
  }
  conversation {
    __typename
    id
    platform
    status
    read
    updatedAt
    lastMessage {
      ...LastMessagePreview
    }
  }
  ... on WhatsappContact {
    phone
  }
  ... on InstagramContact {
    availableForDMs
  }
  ... on TikTokContact {
    availableForDMs
  }
}

# ============================================================
# Queries
# ============================================================

# Left pane: paginated chat list. first is REQUIRED here.
# Pass assigneeFilter: {type: Any}, unreadOnly: false, salesStageV2Filter: []
# for an unfiltered list.
query ChatList(
  $botID: BotID!
  $first: Int!
  $after: ContactSearchCursor
  $assigneeFilter: ContactAssigneeFilter!
  $unreadOnly: Boolean!
  $salesStageV2Filter: [SalesStageV2!]!
  $textInputFilter: String
) {
  bot(id: $botID) {
    id
    contactChatsConnection(
      first: $first
      after: $after
      assigneeFilter: $assigneeFilter
      unreadOnly: $unreadOnly
      salesStageV2Filter: $salesStageV2Filter
      textInputFilter: $textInputFilter
    ) {
      edges {
        cursor
        node {
          ...ChatListContact
        }
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
    }
  }
}

query ChatListCount($botID: BotID!, $filter: ContactChatsCountFilter!) {
  bot(id: $botID) {
    id
    contactChatsCountV2(filter: $filter)
  }
}

# Message history. conversationID IS the contact id (server-side alias).
# No cursor or `after` => newest-first (descending); paginate into history
# with after: pageInfo.endCursor.
query ConversationMessages(
  $botID: BotID!
  $conversationID: ConversationID!
  $first: Int
  $after: MessagesCursor
) {
  bot(id: $botID) {
    id
    conversation(conversationID: $conversationID) {
      __typename
      id
      platform
      status
      read
      updatedAt
      contact {
        __typename
        id
        name
      }
      messages(first: $first, after: $after) {
        edges {
          cursor
          node {
            ...MessageCommon
            ...WhatsAppMessageParts
            ...WebWidgetMessageParts
            ...InstagramMessageParts
            ...FacebookMessageParts
            ...TikTokMessageParts
            ...SystemMessageParts
          }
        }
        pageInfo {
          hasNextPage
          hasPreviousPage
          startCursor
          endCursor
        }
      }
    }
  }
}

query UnseenOpenDialogsCount($botID: BotID!) {
  bot(id: $botID) {
    id
    unseenOpenDialogsCount
  }
}

# ============================================================
# Subscriptions (WebSocket, graphql-transport-ws)
# ============================================================

subscription MessageAdded($botID: BotID!, $conversationID: ConversationID!) {
  messageAdded(botID: $botID, conversationID: $conversationID) {
    ...MessageCommon
    ...WhatsAppMessageParts
    ...WebWidgetMessageParts
    ...InstagramMessageParts
    ...FacebookMessageParts
    ...TikTokMessageParts
    ...SystemMessageParts
  }
}

subscription MessageUpdated($botID: BotID!, $conversationID: ConversationID!) {
  messageUpdated(botID: $botID, conversationID: $conversationID) {
    ...MessageCommon
    ...WhatsAppMessageParts
    ...WebWidgetMessageParts
    ...InstagramMessageParts
    ...FacebookMessageParts
    ...TikTokMessageParts
    ...SystemMessageParts
  }
}

# Chat-list live updates. Handle BOTH union branches: the batch of
# Add/Update/Remove edge actions, and the throttle signal
# ContactListUpdateStopped (refetch at willResumeAt).
subscription ChatListUpdates(
  $botID: BotID!
  $assigneeFilter: ContactAssigneeFilter!
  $unreadOnly: Boolean!
  $salesStageV2Filter: [SalesStageV2!]!
  $textInputFilter: String
) {
  contactsChatUpdates(
    botID: $botID
    assigneeFilter: $assigneeFilter
    unreadOnly: $unreadOnly
    salesStageV2Filter: $salesStageV2Filter
    textInputFilter: $textInputFilter
  ) {
    __typename
    ... on ContactListUpdateStopped {
      willResumeAt
    }
    ... on ContactsChatUpdatesBatch {
      updates {
        action
        edge {
          cursor
          node {
            ...ChatListContact
          }
        }
      }
    }
  }
}

# Pointed subscription for the currently open contact only.
# Do NOT open many of these at once: each one is a live fan-out the server pays
# for, and the list subscription above already covers every other contact.
subscription OpenContactUpdated($botID: BotID!, $contactID: ContactID!) {
  contactUpdated(botID: $botID, contactID: $contactID) {
    ...ChatListContact
  }
}

subscription UnseenOpenDialogsCountChanged($botID: BotID!) {
  unseenOpenDialogsCountChanged(botID: $botID)
}

