# The system lines can name the operator, the auto-close delay and whether
# the AI decided the hand-over. `delay` is a string the server has already
# formatted, and it arrives in more than one shape ("1h23m", "24h:00m:00s"),
# so read it apart and print it in words rather than showing it as it came.
fragment SystemMessageParts on Message {
  ... on SystemTypingMessage {
    until
  }
  ... on SystemConversationSummaryMessage {
    summary
  }
  ... on SystemLivechatOpenedManuallyMessage {
    byUser {
      id
      name
      isUnknown
    }
  }
  ... on SystemLivechatClosedByAutoClosingMessage {
    delay
  }
  ... on SystemLivechatOpenedByComponentMessage {
    originallyDecidedByAI
  }
}

