# Chatfuel GraphQL — automations (the dashboard's "Automations" tab: how the AI
# behaves, configured per scope instead of through one flat bot config).
# Validate against ../chatfuel-core/references/schema.graphql
# (node ../chatfuel-core/scripts/validate-operations.mjs). Usage notes: references/guide.md.
#
# Notes:
#   - FuelySettingUpdateInput and every FuelySetting*Input are @oneOf: send EXACTLY
#     one key. The bundled SDL does not carry the directive, so the validator will
#     not catch a violation — the server will
#   - FuelySetting has no id; __typename is the only discriminator. Keep it on every
#     selection and do not let a normalized cache try to normalize the list

# ============================================================
# Fragments
# ============================================================

fragment AutomationFile on File {
  id
  url
  type
  status
}

# The parent/candidate-parent shape used by inheritance UI. Deliberately shallow:
# settings are not read through inheritsFrom/canInheritFrom.
fragment FuelyAutomationRef on FuelyAutomation {
  __typename
  id
  isBase
  name
  enabled
  scope
}

fragment FuelySettingParts on FuelySetting {
  __typename
  inheritsFrom {
    ...FuelyAutomationRef
  }
  canInheritFrom {
    ...FuelyAutomationRef
  }
  ... on FuelySettingMessageDelays {
    enabled
  }
  ... on FuelySettingWhenAIReplies {
    option
  }
  ... on FuelySettingCatalogImages {
    whenToShow
    imagesPerCatalogItem
  }
  ... on FuelySettingIncomingMessages {
    howToReply
    messagePrompt
  }
  ... on FuelySettingBookingRules {
    autonomyLevel
  }
  ... on FuelySettingSwitchToHuman {
    howToSwitch
    rules {
      switchingConditions
      messagePrompt
      assignees {
        user {
          id
          name
          isUnknown
          profilePicture {
            ...AutomationFile
          }
        }
      }
    }
  }
  ... on FuelySettingFollowUps {
    howToSend
    messagePrompt
  }
  ... on FuelySettingCollectContactInfo {
    howToCollect
    captures {
      description
      attribute {
        name
        type
        dataType
      }
      validationErrors
    }
  }
  ... on FuelySettingPrivateReply {
    privateReplyHowToReply
    exactTextReply
    messagePrompt
  }
  ... on FuelySettingPublicReply {
    publicReplyHowToReply
    exactTextReply
    messagePrompt
    likeContactComment
  }
  ... on FuelySettingKeywords {
    reactTo
    keywords
  }
  ... on FuelySettingListOfPosts {
    posts {
      postID
      contactScopeID
    }
  }
  ... on FuelySettingListOfStories {
    stories {
      storyID
      contactScopeID
    }
  }
  ... on FuelySettingListOfAds {
    adIDs
  }
  ... on FuelySettingRefLinks {
    refs
  }
}

fragment FuelyAutomationParts on FuelyAutomation {
  __typename
  id
  isBase
  name
  enabled
  scope
  updatedAt
  settings {
    ...FuelySettingParts
  }
}

# ============================================================
# Queries
# ============================================================

# Omit $scope to get every automation of the bot. Within one scope the result is
# the base automation (isBase: true) plus its custom ones.
query FuelyAutomationList($botID: BotID!, $scope: FuelyAutomationScope) {
  bot(id: $botID) {
    id
    fuelyAutomations(scope: $scope) {
      ...FuelyAutomationParts
    }
  }
}

query FuelyAutomationGet($botID: BotID!, $automationID: FuelyAutomationID!) {
  bot(id: $botID) {
    id
    fuelyAutomation(id: $automationID) {
      ...FuelyAutomationParts
    }
  }
}

# Overview grid: one aliased call per scope, meta only. Cheaper than fetching every
# automation's settings just to render on/off state.
query FuelyAutomationsOverview($botID: BotID!) {
  bot(id: $botID) {
    id
    All: fuelyAutomations(scope: All) {
      ...FuelyAutomationRef
      updatedAt
    }
    InstagramDirectMessages: fuelyAutomations(scope: InstagramDirectMessages) {
      ...FuelyAutomationRef
      updatedAt
    }
    InstagramPostComments: fuelyAutomations(scope: InstagramPostComments) {
      ...FuelyAutomationRef
      updatedAt
    }
    InstagramAdComments: fuelyAutomations(scope: InstagramAdComments) {
      ...FuelyAutomationRef
      updatedAt
    }
    InstagramStoryReplies: fuelyAutomations(scope: InstagramStoryReplies) {
      ...FuelyAutomationRef
      updatedAt
    }
    InstagramIgMeLinks: fuelyAutomations(scope: InstagramIgMeLinks) {
      ...FuelyAutomationRef
      updatedAt
    }
    InstagramClickFromAds: fuelyAutomations(scope: InstagramClickFromAds) {
      ...FuelyAutomationRef
      updatedAt
    }
    WhatsAppDirectMessages: fuelyAutomations(scope: WhatsAppDirectMessages) {
      ...FuelyAutomationRef
      updatedAt
    }
    WhatsAppClickFromAds: fuelyAutomations(scope: WhatsAppClickFromAds) {
      ...FuelyAutomationRef
      updatedAt
    }
    WhatsAppClickFromPosts: fuelyAutomations(scope: WhatsAppClickFromPosts) {
      ...FuelyAutomationRef
      updatedAt
    }
    FacebookDirectMessages: fuelyAutomations(scope: FacebookDirectMessages) {
      ...FuelyAutomationRef
      updatedAt
    }
    FacebookMMeLinks: fuelyAutomations(scope: FacebookMMeLinks) {
      ...FuelyAutomationRef
      updatedAt
    }
    FacebookPostComments: fuelyAutomations(scope: FacebookPostComments) {
      ...FuelyAutomationRef
      updatedAt
    }
    FacebookClickFromAds: fuelyAutomations(scope: FacebookClickFromAds) {
      ...FuelyAutomationRef
      updatedAt
    }
    TikTokDirectMessages: fuelyAutomations(scope: TikTokDirectMessages) {
      ...FuelyAutomationRef
      updatedAt
    }
    TikTokPostComments: fuelyAutomations(scope: TikTokPostComments) {
      ...FuelyAutomationRef
      updatedAt
    }
    TikTokClickFromAds: fuelyAutomations(scope: TikTokClickFromAds) {
      ...FuelyAutomationRef
      updatedAt
    }
    WebWidgetDirectMessage: fuelyAutomations(scope: WebWidgetDirectMessage) {
      ...FuelyAutomationRef
      updatedAt
    }
  }
}

# Picker for the ListOfPosts / ListOfStories filter settings. The ids come back as
# InstagramMediaID and are passed to the settings as PostID / StoryID — same
# string, different scalar.
query InstagramMediaPicker($botID: BotID!, $first: Int!, $after: InstagramMediasCursor) {
  bot(id: $botID) {
    id
    instagramMediasConnection(first: $first, after: $after) {
      edges {
        cursor
        node {
          __typename
          ... on InstagramPost {
            id
            isUnknown
            caption
            url
            thumbnailPreview {
              ...AutomationFile
            }
          }
          ... on InstagramReel {
            id
            isUnknown
            caption
            url
            thumbnailPreview {
              ...AutomationFile
            }
          }
          ... on InstagramAd {
            id
            isUnknown
            caption
            url
            thumbnailPreview {
              ...AutomationFile
            }
          }
          ... on InstagramStory {
            id
            isUnknown
            caption
            url
            thumbnailPreview {
              ...AutomationFile
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        startCursor
        endCursor
      }
    }
  }
}

# ============================================================
# Subscription
# ============================================================

# One edit can emit SEVERAL events: every automation that inherits the changed
# setting is republished. Merge by automation id; do not assume one event per edit.
subscription FuelyAutomationUpdated($botID: BotID!) {
  fuelyAutomationUpdated(botID: $botID) {
    ...FuelyAutomationParts
  }
}

# ============================================================
# Mutations — automation lifecycle
# ============================================================

# Only scopes that own a filter setting accept custom automations, max 30 each.
mutation FuelyAutomationCreate($botID: BotID!, $scope: FuelyAutomationScope!, $name: String!) {
  fuelyAutomationCreate(botID: $botID, scope: $scope, name: $name) {
    ...FuelyAutomationParts
  }
}

# Base automations cannot be deleted (FuelyAutomationNotDeletable). Returns the Bot,
# so re-read the scope's list from the same response.
mutation FuelyAutomationDelete(
  $botID: BotID!
  $automationID: FuelyAutomationID!
  $scope: FuelyAutomationScope
) {
  fuelyAutomationDelete(botID: $botID, id: $automationID) {
    id
    fuelyAutomations(scope: $scope) {
      ...FuelyAutomationParts
    }
  }
}

# Base automations have no name and cannot be renamed (FuelyAutomationNotRenamable).
mutation FuelyAutomationSetName(
  $botID: BotID!
  $automationID: FuelyAutomationID!
  $name: String!
) {
  fuelyAutomationSetName(botID: $botID, id: $automationID, name: $name) {
    id
    name
    updatedAt
  }
}

# "Turn the bot's AI on/off" = this mutation on the All-scope BASE automation.
mutation FuelyAutomationSetEnabled(
  $botID: BotID!
  $automationID: FuelyAutomationID!
  $enabled: Boolean!
) {
  fuelyAutomationSetEnabled(botID: $botID, id: $automationID, enabled: $enabled) {
    id
    enabled
    updatedAt
  }
}

# ============================================================
# Mutations — settings
# ============================================================
# One mutation field for all 16 settings. The outer FuelySettingUpdateInput picks
# the setting; the inner input picks setInheritFrom OR update. Both are @oneOf.

# Point a setting at a parent instead of owning a value. Allowed parents come from
# the setting's own canInheritFrom; anything else is FuelyInheritFromInvalid.
# One inherit document per inheritable setting type (the 8 common ones plus the two
# comment-reply settings; the five filter settings exist only on custom automations
# and never on a base, so they have nothing to inherit from).
mutation FuelySettingInheritIncomingMessages(
  $botID: BotID!
  $automationID: FuelyAutomationID!
  $parentID: FuelyAutomationID!
) {
  fuelyAutomationUpdateSetting(
    botID: $botID
    id: $automationID
    update: { incomingMessages: { setInheritFrom: $parentID } }
  ) {
    ...FuelyAutomationParts
  }
}

