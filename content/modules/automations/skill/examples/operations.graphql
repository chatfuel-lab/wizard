# ============================================================
# Workspace context
# ============================================================

# One bootstrap query for the workspace: is the bot on the per-scope model, which
# channels are actually connected (a scope whose platform has no contact scope can
# be "on" and never receive a message), the team roster for the switch-to-human
# assignee picker, and the knowledge-base facts the AI answers with (business hours and
# the company details). Tone, language and who to respond to are per-scope automation
# settings, not knowledge-base fields. `contactScopes` order is not stable between
# calls. Validated over HTTP and WS.
query AutomationsBootstrap($botID: BotID!) {
  bot(id: $botID) {
    id
    title
    timezone
    isMigratedToNewFuelySettings
    contactScopes {
      __typename
      id
      ... on WhatsAppPhoneContactScope {
        phone {
          id
          displayPhoneNumber
          verifiedName
        }
      }
      ... on InstagramAccountContactScope {
        instagramAccount {
          id
          username
          name
          profilePicture {
            ...AutomationFile
          }
        }
      }
      ... on TikTokAccountContactScope {
        tiktokAccount {
          id
          username
          name
        }
      }
      ... on FacebookContactScope {
        facebookPage {
          id
          name
          picture {
            ...AutomationFile
          }
        }
      }
      ... on WebWidgetContactScope {
        webWidget {
          id
          name
          isEnabled
        }
      }
    }
    members {
      id
      user {
        id
        name
        isUnknown
        profilePicture {
          ...AutomationFile
        }
      }
      role {
        roleTypeV2
        botPermissions {
          object
          action
        }
      }
    }
    fuelyConfig {
      enabled
      usage {
        total
        catalog
      }
      knowledgeBase {
        companyName
        businessHoursSchedule {
          workingHours {
            day
            enabled
            start
            end
          }
        }
      }
    }
  }
}

# Custom attributes for the lead-qualification capture picker. `platforms` is
# required by the API and means nothing here — pass every platform.
query AutomationsAttributes(
  $botID: BotID!
  $platforms: [Platform!]!
  $inputSubstring: String
  $first: Int
  $after: BotAttributeCursor
) {
  bot(id: $botID) {
    id
    botAttributes(
      locale: En
      platforms: $platforms
      attributeTypes: [custom]
      filters: []
      orderBy: { orderBy: AttributeName, direction: Asc }
      inputSubstring: $inputSubstring
      first: $first
      after: $after
    ) {
      edges {
        node {
          botAttribute {
            name
            type
            dataType
          }
          usersCount
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Resolve picked Instagram media ids to thumbnails / captions (a ListOfPosts entry
# carries only the id). Same InstagramMediaID string as the picker. Unknown id →
# null. Aliased ×N by the caller; validated over WS.
query AutomationsInstagramMedia($botID: BotID!, $id: InstagramMediaID!) {
  bot(id: $botID) {
    id
    contactScopes {
      __typename
      ... on InstagramAccountContactScope {
        instagramAccount {
          id
          media(id: $id) {
            __typename
            ... on InstagramPost {
              id
              isUnknown
              caption
              url
              thumbnailPreview {
                ...AutomationFile
              }
            }
            ... on InstagramReel {
              id
              isUnknown
              caption
              url
              thumbnailPreview {
                ...AutomationFile
              }
            }
            ... on InstagramAd {
              id
              isUnknown
              caption
              url
              thumbnailPreview {
                ...AutomationFile
              }
            }
            ... on InstagramStory {
              id
              isUnknown
              caption
              url
              thumbnailPreview {
                ...AutomationFile
              }
            }
          }
        }
      }
    }
  }
}

# "Refresh from Instagram" in the media picker: pulls the latest media into the
# connection (the dashboard does this before listing; it lengthens the connection).
mutation AutomationsInstagramRefetch($accountID: InstagramAccountID!, $count: Int!) {
  instagramAccountRefetchLatestMedias(id: $accountID, count: $count) {
    id
    username
  }
}

# Facebook page posts for the ListOfPosts filter on Facebook scopes. The setter
# path needs a connected Facebook page; without one the drawer ships behind a
# "paste an id" fallback.
query AutomationsFacebookPosts($botID: BotID!, $first: Int!, $after: FbPagePostCursor) {
  bot(id: $botID) {
    id
    contactScopes {
      __typename
      ... on FacebookContactScope {
        facebookPage {
          id
          name
          posts(first: $first, after: $after) {
            edges {
              cursor
              node {
                id
                message
                permalinkURL
                image {
                  ...AutomationFile
                }
                isPublished
                isExpired
                createdTime
              }
            }
            pageInfo {
              hasNextPage
              endCursor
            }
          }
        }
      }
    }
  }
}

# Meta ads for the ListOfAds filter. One cursor per ad account; the drawer pages
# per account. `metaAdId` is what the setter takes (any string ≤ limit is accepted;
# a pasted Ads Manager URL is too long — parse `selected_ad_ids=` client-side).
# Without Meta ad accounts on the signed-in user the query still validates, but
# the picker path cannot be exercised.
query AutomationsMetaAds($botID: BotID!, $platforms: [Platform!]!, $first: Int!, $after: MetaAdCursor) {
  currentUser {
    id
    metaAdsSyncState {
      id
      requestedAt
      finishedAt
    }
    metaAdAccounts {
      id
      metaAdAccountID
      name
      hasWhatsappAds
      hasInstagramAds
      ads(botID: $botID, platforms: $platforms, first: $first, after: $after) {
        edges {
          cursor
          node {
            id
            name
            metaAdId
            effectiveStatus
            thumbnailURL
            adSetDestinationType
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}

# ============================================================
# Preview (test chat). Own copies of the preview surface: module code may
# not import another module's generated documents. Text-only sends.
# ============================================================

fragment AutomationsPvMessage on Message {
  __typename
  id
  clientId
  sentTime
  updatedAt
  sender {
    __typename
    id
    name
  }
  errors {
    code
    date
  }
  ... on WhatsAppInTextMessage {
    text
  }
  ... on WhatsAppOutTextMessage {
    text
  }
  ... on WebWidgetTextMessage {
    text
  }
  ... on InstagramInTextMessage {
    text
  }
  ... on InstagramOutTextMessage {
    text
  }
  ... on TikTokInTextMessage {
    text
  }
  ... on TikTokOutTextMessage {
    text
  }
  ... on FacebookInTextMessage {
    text
  }
  ... on FacebookOutTextMessage {
    text
  }
  ... on SystemTypingMessage {
    until
  }
  ... on SystemConversationSummaryMessage {
    summary
  }
  ... on SystemLivechatOpenedByComponentMessage {
    originallyDecidedByAI
  }
}

# Pins a preview session to ONE automation (base or custom, enabled or not — the
# direct call bypasses `enabled` and every filter). The platform is the scope's,
# returned on the session. The All base is not previewable:
# PreviewResponsesFuelyAutomationScopeNotPreviewable.
mutation AutomationsPreviewStartForAutomation($botID: BotID!, $automationID: FuelyAutomationID!) {
  previewResponsesStartForFuelyAutomation(botID: $botID, fuelyAutomationID: $automationID) {
    __typename
    id
    conversationID
    startedAt
    platform
    fuelyAutomationID
  }
}

query AutomationsPreviewMessages($botID: BotID!, $conversationID: ConversationID!, $first: Int, $after: MessagesCursor) {
  bot(id: $botID) {
    id
    conversation(conversationID: $conversationID) {
      id
      platform
      messages(first: $first, after: $after) {
        edges {
          cursor
          node {
            ...AutomationsPvMessage
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}

# The subscription takes ~1–3 s to become active; subscribe before sending.
subscription AutomationsPreviewMessageAdded($botID: BotID!, $conversationID: ConversationID!) {
  messageAdded(botID: $botID, conversationID: $conversationID) {
    ...AutomationsPvMessage
  }
}

subscription AutomationsPreviewMessageUpdated($botID: BotID!, $conversationID: ConversationID!) {
  messageUpdated(botID: $botID, conversationID: $conversationID) {
    ...AutomationsPvMessage
  }
}

