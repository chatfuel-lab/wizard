# Dry-run: fires the real HTTP request and returns the exchange.
# DefinedErrorCode: TestRequestConnectionRefused
mutation TestSendJsonRequest($elementID: BlockElementID!) {
  sendJsonTestRequest(blockElementID: $elementID) {
    statusCode
    statusName
    requestURL
    requestMethod
    requestBody
    requestHeaders {
      header
      value
    }
    responseBody
    responseHeaders {
      header
      value
    }
  }
}

