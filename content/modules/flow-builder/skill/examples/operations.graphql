# The rest of the CreateWithBlock roster — every remaining plugin family, all
# plain (flowID, positionX, positionY). aiAgent above is the ONLY family with
# an extra arg. The chat-trigger entry-point families (triggered message,
# one-time broadcast, scheduled message) are born with the entry point
# disabled; their ...CreateWithBlockAndWATemplate variants (same args) also
# attach a WhatsApp template element — not documented here.
#
# These select FlowBlocksSlim ON PURPOSE, not FlowParts: 22 more whole-flow
# responses would each inline the 30-variant element union and blow up
# generated-type size (and tsc memory). The slim response is enough to diff
# out the new block's id — REFETCH FlowStructure afterwards for elements,
# connections and validation errors.

fragment FlowBlocksSlim on Flow {
  id
  blocks {
    __typename
    id
    name
    positionX
    positionY
  }
}

