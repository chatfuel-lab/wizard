# ------------------------------------------------------------
# Sending as the (preview) contact — button and list clicks
# ------------------------------------------------------------
# Clicks are matched server-side by messageId + the button's TITLE STRING, not
# by a handle id; duplicate titles in one message are ambiguous and the first
# match wins. Only ContinueFlow / QuickReply / list-row clicks advance the
# flow — URL and call-phone buttons are client-side (open it yourself; the
# widget's click mutations exist only to record that it happened, and WhatsApp
# URL buttons have no click mutation at all).

mutation FlowTestWidgetContinueFlowClick(
  $botID: BotID!
  $conversationID: ConversationID!
  $click: PreviewResponsesBtnClickInput!
) {
  previewResponsesWidgetContinueFlowBtnClickSend(
