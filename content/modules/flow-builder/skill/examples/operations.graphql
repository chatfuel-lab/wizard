# Flow builder: flows, groups, blocks, block elements ("plugins"), buttons,
# connections, validation state, attribute autocomplete.
# See references/guide.md for the mental model and traps (chatfuel-flow-builder skill).
# Validate against ../chatfuel-core/references/schema.graphql
# (node ../chatfuel-core/scripts/validate-operations.mjs).
#
# Conventions encoded here:
# - FlowStructure is the single read for one flow; its fragments cover every
#   concrete Block (17) and BlockElement (30) type — copy them wholesale so an
#   unknown __typename can never crash your renderer.
# - Every editing mutation returns the enclosing Flow/Block aggregate; select
#   the same fragments and reconcile your local state from the result (there
#   are NO flow-builder subscriptions).
# - Rich text READS as TemplateStr parts, WRITES as a plain String with
#   "{{attribute name}}" placeholders.

# ============================================================
# Shared fragments
# ============================================================

fragment AttrName on BotAttribute {
  name
  type
  dataType
}

fragment TStr on TemplateStr {
  parts {
    __typename
    ... on TemplateStrText {
      text
      errCode
    }
    ... on TemplateStrAttribute {
      attribute {
        ...AttrName
      }
      errCode
    }
  }
}

fragment FileRef on File {
  id
  url
  type
  status
  size
}

# Validation is business STATE on the element, not a GraphQL error.
# Locator fields tell you which button/row/header/rule the error points at.
fragment ElementErrors on BlockElement {
  errors {
    __typename
    code
    message
    ... on ButtonValidationError {
      buttonID
    }
    ... on AiAgentRuleError {
      ruleID
    }
    ... on SendJsonHeaderError {
      headerID
    }
    ... on SendJsonURLParamError {
      urlParamID
    }
    ... on SendJsonResponseParsingRuleError {
      responseParsingRuleID
    }
    ... on SummarizeChatEntryValidationError {
      entryID
    }
    ... on WhatsAppTemplateParamValueRequiredError {
      paramName
    }
    ... on WhatsAppTemplateURLButtonParamValueRequiredError {
      buttonID
      paramName
    }
  }
}

# Segments are read as Segment and written wholesale via SegmentInput
# (client-generated UUIDs for segment/filter ids) — see ../chatfuel-contacts/references/guide.md.
# Read WHOLE segments: segment setters take a full SegmentInput (wholesale
# replace, client-generated UUID ids) — any filter part the UI does not read
# back here would be silently destroyed on the next save. byInFlightSegment is
# read one level deep, matching what this editor can produce.
fragment SegmentFilterParts on Filter {
  id
  byAttribute {
    attribute {
      ...AttrName
    }
    defaultStrategy {
      operator
      comparableValues
    }
    dateStrategy {
      operator
      comparableDate
    }
  }
  byTag {
    operator
    tagNames
  }
  byStoredSegment {
    operator
    segmentIDs
  }
}

fragment SegmentParts on Segment {
  id
  name
  resultOperator
  filters {
    ...SegmentFilterParts
    byInFlightSegment {
      id
      name
      resultOperator
      filters {
        ...SegmentFilterParts
      }
    }
  }
}

# The trigger sub-object of a TriggeredMessageBlockElement. The trigger* ops
# return Trigger! alone (no enclosing block) — reconcile with a refetch.
# attributeCondition strategies are read in full: triggerSetAttributeFilter
# writes a whole AttrFilterInput, same wholesale rule as segments.
fragment TriggerParts on Trigger {
  id
  enabled
  conditionType
  delayValue
  delayUnit
  attributeCondition {
    attribute {
      ...AttrName
    }
    defaultStrategy {
      operator
      comparableValues
    }
    dateStrategy {
      operator
      comparableDate
    }
  }
  attributeConditionErrors
  validationErrors
}

fragment WidgetBtn on WidgetButton {
  __typename
  ... on WidgetContinueFlowButton {
    id
    title {
      ...TStr
    }
  }
  ... on WidgetOpenURLButton {
    id
    title {
      ...TStr
    }
    url {
      ...TStr
    }
  }
  ... on WidgetCallPhoneButton {
    id
    title {
      ...TStr
    }
    phone
  }
}

fragment WABtn on WhatsAppButton {
  __typename
  ... on WhatsAppContinueFlowButton {
    id
    title {
      ...TStr
    }
  }
  ... on WhatsAppOpenURLButton {
    id
    title {
      ...TStr
    }
    url {
      ...TStr
    }
  }
}

fragment WATplText on WhatsAppTemplateComponentText {
  text {
    __typename
    ... on WhatsAppTemplateComponentTextPartText {
      text
    }
    ... on WhatsAppTemplateComponentTextPartParam {
      name
      value {
        ...TStr
      }
    }
  }
}

# ============================================================
# The element ("plugin") umbrella — all 30 concrete types
# ============================================================

fragment ElementParts on BlockElement {
  __typename
  id
  platform
  ...ElementErrors
  ... on ContentBlockElement {
    waitForReplies
    saveContactReply
    savingToAttribute {
      ...AttrName
    }
  }
  # --- WhatsApp content ---
  ... on WhatsAppTextBlockElement {
    text {
      ...TStr
    }
  }
  ... on WhatsAppImageBlockElement {
    image {
      ...FileRef
    }
    caption {
      ...TStr
    }
  }
  ... on WhatsAppVideoBlockElement {
    video {
      ...FileRef
    }
    caption {
      ...TStr
    }
    fileName
  }
  ... on WhatsAppAudioBlockElement {
    audio {
      ...FileRef
    }
    fileName
  }
  ... on WhatsAppDocumentBlockElement {
    document {
      ...FileRef
    }
    caption {
      ...TStr
    }
    fileName
  }
  # --- WhatsApp interactive (one card per block) ---
  ... on WhatsAppTextAndButtonsBlockElement {
    headerText {
      ...TStr
    }
    bodyText {
      ...TStr
    }
    footerText {
      ...TStr
    }
    buttons {
      ...WABtn
    }
  }
  ... on WhatsAppTextAndURLBlockElement {
    headerText {
      ...TStr
    }
    bodyText {
      ...TStr
    }
    footerText {
      ...TStr
    }
    buttons {
      ...WABtn
    }
  }
  ... on WhatsAppListBlockElement {
    bodyText {
      ...TStr
    }
    buttonTitle {
      ...TStr
    }
    rows {
      id
      title {
        ...TStr
      }
      description {
        ...TStr
      }
    }
  }
  ... on WhatsAppTemplateBlockElement {
    whatsAppTemplate {
      templateID
      name
      status
      header {
        __typename
        ... on WhatsAppTemplateComponentText {
          ...WATplText
        }
        ... on WhatsAppTemplateComponentImage {
          image {
            ...FileRef
          }
        }
        ... on WhatsAppTemplateComponentVideo {
          video {
            ...FileRef
          }
        }
        ... on WhatsAppTemplateComponentDocument {
          document {
            ...FileRef
          }
          fileName
        }
      }
      body {
        ... on WhatsAppTemplateComponentText {
          ...WATplText
        }
      }
      footer {
        ... on WhatsAppTemplateComponentText {
          ...WATplText
        }
      }
      buttons {
        __typename
        ... on WhatsAppTemplateURLButton {
          id
          text
          url {
            __typename
            ... on WhatsAppTemplateComponentTextPartText {
              text
            }
            ... on WhatsAppTemplateComponentTextPartParam {
              name
              value {
                ...TStr
              }
            }
          }
        }
        ... on WhatsAppTemplateQuickReplyButton {
          id
          text
        }
        ... on WhatsAppTemplateCallPhoneButton {
          text
          phoneNumber
        }
        ... on WhatsAppTemplateWhatsAppCallButton {
          text
        }
        ... on WhatsAppTemplateCopyCodeButton {
          id
          text
          code {
            ...TStr
          }
        }
      }
    }
  }
  # --- Widget content ---
  ... on WidgetTextAndButtonBlockElement {
    text {
      ...TStr
    }
    buttons {
      ...WidgetBtn
    }
  }
  ... on WidgetImageBlockElement {
    image {
      ...FileRef
    }
  }
  # --- Entry points ---
  ... on WidgetEntryPointBlockElement {
    nextBlockHandleID
  }
  ... on DefaultReplyBlockElement {
    nextBlockHandleID
    replyFrequency
  }
  ... on TriggeredMessageBlockElement {
    handleID
    segment {
      ...SegmentParts
    }
    segmentErrors {
      filterID
      code
    }
    trigger {
      ...TriggerParts
    }
  }
  ... on WhatsAppOneTimeNotificationBlockElement {
    status
    handleID
    segment {
      ...SegmentParts
    }
    segmentErrors {
      filterID
      code
    }
    sentToContactsCount
  }
  ... on WhatsAppScheduledMessageBlockElement {
    handleID
    segment {
      ...SegmentParts
    }
    segmentErrors {
      filterID
      code
    }
    status
    firstSendTime
    repeatType
    repeatOnWeekdays
    repeatEveryNDays
    repeatOnCertainDates
  }
  # --- Actions ---
  ... on SetConditionBlockElement {
    handleID
    segment {
      ...SegmentParts
    }
    segmentErrors {
      filterID
      code
    }
  }
  ... on SetContactPropertyBlockElement {
    attribute {
      ...AttrName
    }
    value
  }
  ... on ClearContactPropertyBlockElement {
    attribute {
      ...AttrName
    }
  }
  ... on RedirectToFlowBlockElement {
    flow {
      id
      name
    }
  }
  ... on SendJsonBlockElement {
    httpMethod
    url {
      ...TStr
    }
    headers {
      id
      title {
        ...TStr
      }
      value {
        ...TStr
      }
    }
    payloadType
    customRequestPayload {
      ...TStr
    }
    encodedURLPayload {
      id
      title {
        ...TStr
      }
      value {
        ...TStr
      }
    }
    responseParsingRulesEnabled
    responseParsingRules {
      id
      jsonPath
      attribute {
        ...AttrName
      }
    }
  }
  ... on SummarizeChatBlockElement {
    entries {
      id
      description
      attribute {
        ...AttrName
      }
    }
  }
  # Widget/WhatsApp/Instagram/TikTok SwitchToChatWithHumanAgent elements have
  # no extra fields beyond the BlockElement base.
  # --- AI agent (see references/guide.md for scope notes) ---
  ... on FuelyAIAgentBlockElement {
    templateID
    additionalInstructions
    charsCount
    rules {
      id
      title
      prompt
    }
  }
  ... on AiAgentBlockElement {
    templateID
    maxTokens
    availableTokens
    knowledgeItems {
      id
      title
      description
      prompt
    }
    rules {
      id
      title
      prompt
    }
  }
  ... on AiAgentCustomBlockElement {
    maxTokens
    availableTokens
    prompt
    rules {
      id
      title
      prompt
    }
  }
}

# ============================================================
# Block / connection / flow fragments
# ============================================================

# CONCRETE type casts on purpose — do NOT rewrite these as interface casts
# (... on ContentBlock / ActionBlock / EntryPointBlock): combining Block
# interface casts with the wide ElementParts selection is a shape the API
# will not answer, and an expensive one to ask for. Concrete casts plan
# instantly. Keep the selection to what the fragment names: adding a field
# with a resolver of its own to a fragment this wide is what turns a plan the
# API answers instantly into one it declines.
fragment BlockParts on Block {
  __typename
  id
  name
  positionX
  positionY
  platform
  ... on RegularContentBlock {
    isStartingPoint
  }
  ... on AiAgentBlock {
    isStartingPoint
  }
  ... on WhatsAppListBlock {
    isStartingPoint
  }
  ... on WhatsAppTemplateBlock {
    isStartingPoint
  }
  ... on WhatsAppTextAndButtonsBlock {
    isStartingPoint
  }
  ... on WhatsAppTextAndURLBlock {
    isStartingPoint
  }
  ... on RegularActionBlock {
    isStartingPoint
  }
  ... on ClearContactPropertyBlock {
    isStartingPoint
  }
  ... on SetConditionBlock {
    isStartingPoint
  }
  ... on SetContactPropertyBlock {
    isStartingPoint
  }
  ... on RedirectToFlowBlock {
    isStartingPoint
  }
  ... on DefaultReplyBlock {
    showToggle
    isEntryPointEnabled
  }
  ... on TriggeredMessageBlock {
    showToggle
    isEntryPointEnabled
  }
  ... on WhatsAppOneTimeNotificationBlock {
    showToggle
    isEntryPointEnabled
  }
  ... on WhatsAppScheduledMessageBlock {
    showToggle
    isEntryPointEnabled
  }
  ... on WidgetEntryPointBlock {
    showToggle
    isEntryPointEnabled
  }
  blockElements {
    ...ElementParts
  }
}

# ConnectionID is synthesized per-request from its parts — never persist it.
fragment ConnectionParts on Connection {
  __typename
  ... on BlockToBlockConnection {
    id
    sourceBlockID
    targetBlockID
  }
  ... on ComponentToBlockConnection {
    id
    sourceBlockID
    sourceBlockElementID
    sourceHandleID
    targetBlockID
  }
}

fragment FlowParts on Flow {
  __typename
  id
  name
  platform
  startingPointBlock {
    id
  }
  entryPoints {
    __typename
    id
    name
    isEntryPointEnabled
  }
  blocks {
    ...BlockParts
  }
  connections {
    ...ConnectionParts
  }
}

fragment FlowListItem on Flow {
  __typename
  id
  name
  platform
  entryPoints {
    id
    name
    isEntryPointEnabled
  }
}

# ============================================================
# Reads
# ============================================================

# Three flat buckets, no pagination.
query FlowsList($botID: BotID!) {
  bot(id: $botID) {
    id
    flowGroups {
      id
      name
      flows {
        ...FlowListItem
      }
    }
    flowsWithoutGroup {
      ...FlowListItem
    }
    defaultReplyFlows {
      ...FlowListItem
    }
  }
}

# One query loads the entire flow: blocks, elements, connections, entry points.
query FlowStructure($botID: BotID!, $flowID: FlowID!) {
  bot(id: $botID) {
    id
    flow(flowID: $flowID) {
      ...FlowParts
      inboundLinks {
        __typename
        ... on FlowToFlowInboundLink {
          id
          redirects
          flow {
            id
            name
          }
          block {
            id
            name
          }
        }
        ... on KeywordGroupToFlowInboundLink {
          id
          redirects
        }
      }
    }
  }
}

# Attribute autocomplete for text inputs / attribute pickers.
# Fire twice like the dashboard: attributeTypes [custom] and [system].
query BotAttributesAutocomplete(
  $botID: BotID!
  $locale: DashboardLocale!
  $platforms: [Platform!]!
  $attributeTypes: [AttributeType!]!
  $inputSubstring: String
  $first: Int
  $after: BotAttributeCursor
) {
  bot(id: $botID) {
    id
    botAttributes(
      locale: $locale
      platforms: $platforms
      attributeTypes: $attributeTypes
      inputSubstring: $inputSubstring
      first: $first
      after: $after
      filters: []
      orderBy: { orderBy: AttributeName, direction: Asc }
    ) {
      edges {
        cursor
        node {
          botAttribute {
            ...AttrName
            aliases {
              locale
              alias
            }
          }
          usersCount
          defaultValue
          flowsCount
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# AI-agent block templates catalog (drives the "add AI agent" menu).
query AiAgentTemplatesCatalog($locale: DashboardLocale!) {
  aiAgentTemplates(locale: $locale) {
    id
    title
    description
  }
}

# ============================================================
# Flow & group CRUD
# ============================================================

# No name argument — the server names the flow; rename with RenameFlow.
mutation CreateFlow($botID: BotID!, $platform: Platform!) {
  createFlow(botID: $botID, platform: $platform) {
    id
    flowsWithoutGroup {
      ...FlowListItem
    }
  }
}

mutation RenameFlow($flowID: FlowID!, $name: String!) {
  updateFlowName(flowID: $flowID, name: $name) {
    id
    name
  }
}

mutation DeleteFlow($flowID: FlowID!) {
  deleteFlow(flowID: $flowID) {
    id
    flowGroups {
      id
      flows {
        id
      }
    }
    flowsWithoutGroup {
      id
    }
  }
}

mutation CreateFlowGroup($botID: BotID!) {
  createFlowGroup(botID: $botID) {
    id
    flowGroups {
      id
      name
    }
  }
}

mutation RenameFlowGroup($groupID: FlowGroupID!, $name: String!) {
  updateFlowGroupName(id: $groupID, name: $name) {
    id
    name
  }
}

# DefinedErrorCode: FlowGroupCanNotBeDeleted
mutation DeleteFlowGroup($groupID: FlowGroupID!) {
  deleteFlowGroup(flowGroupId: $groupID) {
    id
    flowGroups {
      id
    }
    flowsWithoutGroup {
      id
    }
  }
}

mutation MoveFlowToGroup($flowID: FlowID!, $groupID: FlowGroupID!) {
  moveFlowToGroup(flowID: $flowID, groupID: $groupID) {
    id
    flowGroups {
      id
      flows {
        id
      }
    }
    flowsWithoutGroup {
      id
    }
  }
}

mutation RemoveFlowFromGroup($flowID: FlowID!) {
  removeFlowFromGroup(flowID: $flowID) {
    id
    flowsWithoutGroup {
      id
    }
  }
}

mutation SortFlowGroups($botID: BotID!, $flowGroupIDs: [FlowGroupID!]!) {
  sortFlowGroups(botID: $botID, flowGroupIds: $flowGroupIDs) {
    id
    flowGroups {
      id
    }
  }
}

mutation SortFlowsInGroup($groupID: FlowGroupID!, $flowIDs: [FlowID!]!) {
  sortFlowsInGroup(groupID: $groupID, flowIds: $flowIDs) {
    id
    flows {
      id
    }
  }
}

mutation SortUngroupedFlows($botID: BotID!, $flowIDs: [FlowID!]!) {
  sortUngroupedFlows(botID: $botID, flowIds: $flowIDs) {
    id
    flowsWithoutGroup {
      id
    }
  }
}

# ============================================================
# Block operations
# ============================================================

# Positions are Int — round before sending. Single-block move returns Block,
# bulk move returns the whole Flow (different cache paths).
mutation MoveBlock($flowID: FlowID!, $blockID: BlockID!, $x: Int!, $y: Int!) {
  updateBlockPosition(flowID: $flowID, blockID: $blockID, positionX: $x, positionY: $y) {
    id
    positionX
    positionY
  }
}

mutation MoveBlocksBulk($flowID: FlowID!, $update: [BlockPositionBulkUpdate!]!) {
  updateBlockPositionBulk(flowID: $flowID, update: $update) {
    id
    blocks {
      id
      positionX
      positionY
    }
  }
}

mutation RenameBlock($flowID: FlowID!, $blockID: BlockID!, $name: String!) {
  updateBlockName(flowID: $flowID, blockID: $blockID, name: $name) {
    id
    name
  }
}

mutation DeleteBlock($flowID: FlowID!, $blockID: BlockID!) {
  deleteBlock(flowID: $flowID, blockID: $blockID) {
    ...FlowParts
  }
}

mutation SetStartingPoint($flowID: FlowID!, $blockID: BlockID!) {
  blockSetStartingPoint(flowID: $flowID, blockID: $blockID) {
    ...FlowParts
  }
}

# DefinedErrorCode: ComponentHasValidationErrors (element still invalid),
# TriggerIsInInvalidState (triggered message EP).
mutation EnableEntryPoint($flowID: FlowID!, $blockID: BlockID!) {
  blockEnableEntryPoint(flowID: $flowID, blockID: $blockID) {
    ...FlowParts
  }
}

mutation DisableEntryPoint($flowID: FlowID!, $blockID: BlockID!) {
  blockDisableEntryPoint(flowID: $flowID, blockID: $blockID) {
    ...FlowParts
  }
}

# ============================================================
# Element (card) operations
# ============================================================

# NOTE: takes botID, not flowID — the one in this set that does.
mutation DeleteElement($botID: BotID!, $elementID: BlockElementID!) {
