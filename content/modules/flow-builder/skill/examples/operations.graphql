# ------------------------------------------------------------
# Create-and-connect — the triad's second leg for every family
# ------------------------------------------------------------
# Dragging an edge into empty canvas creates the block AND wires the dangling
# edge in one atomic round-trip: request.sourceBlockID (+ optional
# sourceBlockElementID/sourceHandleID for element outlets) names the edge's
# source. The four entry-point families (widgetEP, triggeredMessage,
# whatsAppOneTimeNotification, whatsAppScheduledMessage) have NO connected
# variant — entry points cannot be edge targets. whatsAppText's connected
# variant is documented in the triad section above. Slim responses on purpose,
# same as the plain CreateWithBlock roster: diff the new block id, refetch.

