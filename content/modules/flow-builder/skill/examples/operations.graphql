# --- WhatsApp template ---
# The template picker: bot.whatsAppTemplates, filter client-side on
# IsSupportedInFlowbuilder (the livechat-era isSupported flag is not in this schema).

query WhatsAppTemplatesCatalog($botID: BotID!, $first: Int) {
  bot(id: $botID) {
    id
    whatsAppTemplates(first: $first) {
      edges {
        node {
          id
          name
          status
          language
          category
          IsSupportedInFlowbuilder
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

