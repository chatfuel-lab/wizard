# ============================================================
# Test the flow — a real preview conversation
# ============================================================
# `previewResponsesStartInFlow` mints a preview conversation on a synthetic
# contact and IMMEDIATELY runs this flow from its starting-point block, so the
# first bot messages arrive on the subscription with nobody having typed
# anything. Everything after that rides the ORDINARY livechat API:
# `conversationID` is the preview contact's conversation, history is
# `bot.conversation.messages`, realtime is `messageAdded`/`messageUpdated`.
#
# In a preview YOU are the contact: your sends come back as In* message types
# and the flow's output arrives as Out* types — which is why the thread renders
# In on the right and Out on the left.
#
# Own copies of the preview surface: a module may not import another module's
# generated documents, and the automations Test panel keeps its own set for the
# same reason. Returns stay slim — this file's generated types are the ones
# with the heap-size history.

fragment FtFile on File {
  id
  url
  type
  status
  size
}

fragment FtMessageCommon on Message {
  __typename
  id
  clientId
  sentTime
  updatedAt
  sender {
    __typename
    id
    name
  }
  errors {
    code
    date
  }
}

# Message-side button types (WhatsApp*MessageButton, plain title strings) are
# NOT the flow-builder's button types (the WhatsAppButton union, TemplateStr
# titles) — a click is addressed by the rendered title, not by a handle id.
fragment FtWhatsAppParts on Message {
  ... on WhatsAppInTextMessage {
    text
  }
  ... on WhatsAppInContinueFlowButtonClickMessage {
    buttonTitle
  }
  ... on WhatsAppInTemplateQuickReplyButtonClickMessage {
    buttonTitle
  }
  ... on WhatsAppInListRowClickMessage {
    rowTitle
    rowDescription
  }
  ... on WhatsAppOutTextMessage {
    text
  }
  ... on WhatsAppOutTextAndButtonsMessage {
    headerText
    bodyText
    footerText
    whatsappButtons {
      __typename
      title
      ... on WhatsAppOpenURLMessageButton {
        url
      }
    }
  }
  ... on WhatsAppOutTextAndURLMessage {
    headerText
    bodyText
    footerText
    whatsappButtons {
      __typename
      title
      ... on WhatsAppOpenURLMessageButton {
        url
      }
    }
  }
  ... on WhatsAppOutListMessage {
    bodyText
    buttonTitle
    listRows {
      title
      description
    }
  }
  ... on WhatsAppOutTemplateMessage {
    header {
      __typename
      ... on WhatsAppOutTemplateMessageComponentText {
        text
      }
      ... on WhatsAppOutTemplateMessageComponentImage {
        file {
          ...FtFile
        }
      }
      ... on WhatsAppOutTemplateMessageComponentVideo {
        file {
          ...FtFile
        }
      }
      ... on WhatsAppOutTemplateMessageComponentDocument {
        file {
          ...FtFile
        }
      }
    }
    body {
      ... on WhatsAppOutTemplateMessageComponentText {
        text
      }
    }
    footer {
      ... on WhatsAppOutTemplateMessageComponentText {
        text
      }
    }
    waTemplateButtons {
      __typename
      ... on WhatsAppOutTemplateMessageURLButton {
        text
        url
      }
      ... on WhatsAppOutTemplateMessageQuickReplyButton {
        text
      }
    }
  }
  ... on WhatsAppOutImageMessage {
    caption
    file {
      ...FtFile
    }
  }
  ... on WhatsAppOutVideoMessage {
    caption
    file {
      ...FtFile
    }
  }
  ... on WhatsAppOutAudioMessage {
    file {
      ...FtFile
    }
  }
  ... on WhatsAppOutDocumentMessage {
    caption
    fileName
    file {
      ...FtFile
    }
  }
}

# The widget's text message is ONE typename in both directions — read the
# sender to know which way it went.
fragment FtWidgetParts on Message {
  ... on WebWidgetTextMessage {
    text
  }
  ... on WebWidgetTextAndButtonsMessage {
    text
    buttons {
      __typename
      title
      ... on WebWidgetOpenURLButton {
        url
      }
      ... on WebWidgetCallPhoneButton {
        phone
      }
    }
  }
  ... on WebWidgetContinueFlowButtonClickMessage {
    button {
      title
    }
  }
  ... on WebWidgetOpenURLButtonClickMessage {
    button {
      title
      url
    }
  }
  ... on WebWidgetCallPhoneButtonClickMessage {
    button {
      title
      phone
    }
  }
}

fragment FtOtherPlatformParts on Message {
  ... on InstagramInTextMessage {
    text
  }
  ... on InstagramOutTextMessage {
    text
  }
  ... on TikTokInTextMessage {
    text
  }
  ... on TikTokOutTextMessage {
    text
  }
  ... on FacebookInTextMessage {
    text
  }
  ... on FacebookOutTextMessage {
    text
  }
}

# SystemTypingMessage is a hint with an expiry, not a row.
# SystemLivechatOpenedByComponentMessage as the NEWEST message means the flow
# handed the conversation to a human: nothing else will answer, so the composer
# closes and Restart is the way on.
fragment FtSystemParts on Message {
  ... on SystemTypingMessage {
    until
  }
  ... on SystemConversationSummaryMessage {
    summary
  }
  ... on SystemLivechatOpenedByComponentMessage {
    originallyDecidedByAI
  }
}

fragment FtMessageParts on Message {
  ...FtMessageCommon
  ...FtWhatsAppParts
  ...FtWidgetParts
  ...FtOtherPlatformParts
  ...FtSystemParts
}

# The flow session carries no platform of its own — the FLOW's platform is what
# picks the send mutation. `startingBlock` is nullable: the block may have been
# deleted since.
fragment FtSessionParts on PreviewResponsesFlowSession {
  id
  conversationID
  startedAt
  startingBlock {
    id
    name
  }
}

# DefinedErrorCode: FlowStartingPointBlockDoesNotExist, ScopeNotConnectedToBot
mutation FlowTestStart($flowID: FlowID!) {
  previewResponsesStartInFlow(flowID: $flowID) {
    ...FtSessionParts
  }
}

# The latest session of the signed-in user for THIS flow, or null. Flows are
# the only preview target with a readback, which is what lets the panel survive
# a page reload instead of starting over.
query FlowTestSessionReadback($botID: BotID!, $flowID: FlowID!) {
  bot(id: $botID) {
    id
    flow(flowID: $flowID) {
      id
      previewResponsesSession {
        ...FtSessionParts
      }
    }
  }
}

# No cursor => newest-first; older pages via after: pageInfo.endCursor.
query FlowTestMessages(
  $botID: BotID!
  $conversationID: ConversationID!
  $first: Int
  $after: MessagesCursor
) {
  bot(id: $botID) {
    id
    conversation(conversationID: $conversationID) {
      __typename
      id
      platform
      messages(first: $first, after: $after) {
        edges {
          cursor
          node {
            ...FtMessageParts
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}

# Subscribe FIRST, then load one page: the subscription needs 1-3 s to become
# active and events emitted before that are lost.
subscription FlowTestMessageAdded($botID: BotID!, $conversationID: ConversationID!) {
  messageAdded(botID: $botID, conversationID: $conversationID) {
    ...FtMessageParts
  }
}

subscription FlowTestMessageUpdated($botID: BotID!, $conversationID: ConversationID!) {
  messageUpdated(botID: $botID, conversationID: $conversationID) {
    ...FtMessageParts
  }
}

# ------------------------------------------------------------
# Sending as the (preview) contact — text
# ------------------------------------------------------------
# A fresh UUID clientId per send; the result is YOUR echo and its `id` may be
# null on the wire, so merge by clientId and never by id.

