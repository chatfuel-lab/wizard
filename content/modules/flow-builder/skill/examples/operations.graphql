# ============================================================
# Connections
# ============================================================

# Block-level "next" edge: at most ONE per source block; create is an upsert.
mutation ConnectBlocks($flowID: FlowID!, $request: BlockToBlockConnectionCreateRequest!) {
  blockToBlockConnectionCreateOrUpdate(flowID: $flowID, request: $request) {
    ...FlowParts
  }
}

# From a handle inside an element (button id, condition handleID,
# nextBlockHandleID, ...) to a target block.
mutation ConnectComponent($flowID: FlowID!, $request: ComponentToBlockConnectionCreateRequest!) {
  componentToBlockConnectionCreateOrUpdate(flowID: $flowID, request: $request) {
    ...FlowParts
  }
}

mutation DisconnectBlocks($flowID: FlowID!, $sourceBlockID: BlockID!) {
  blockToBlockConnectionDelete(flowID: $flowID, sourceBlockID: $sourceBlockID) {
    ...FlowParts
  }
}

mutation DisconnectComponent(
  $flowID: FlowID!
  $sourceBlockElementID: BlockElementID!
  $sourceHandleID: ComponentHandleID!
) {
  componentToBlockConnectionDelete(
    flowID: $flowID
    sourceBlockElementID: $sourceBlockElementID
    sourceHandleID: $sourceHandleID
  ) {
    ...FlowParts
  }
}

# ============================================================
# Creating blocks — the plugin creation triad
# ============================================================
# There is NO createBlock. Every plugin family has:
#   <plugin>CreateWithBlock(flowID, positionX, positionY)              -> Flow
#   <plugin>CreateWithBlockAndConnection(flowID, request, x, y)        -> Flow
#   <plugin>CreateInBlock(blockID)   (only stackable plugins)          -> Block
# Swap the field name for other plugin families — same shape.

mutation CreateWhatsAppTextBlock($flowID: FlowID!, $x: Int!, $y: Int!) {
  whatsAppTextCreateWithBlock(flowID: $flowID, positionX: $x, positionY: $y) {
    ...FlowParts
  }
}

# request.sourceBlockID (+ optional sourceBlockElementID/sourceHandleID)
# wires the dangling edge to the freshly created block.
mutation CreateWhatsAppTextBlockConnected(
  $flowID: FlowID!
  $request: UndefinedTargetBlockConnectionCreateRequest!
  $x: Int!
  $y: Int!
) {
  whatsAppTextCreateWithBlockAndConnection(
    flowID: $flowID
    request: $request
