<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tab icon and the tab name. Both are rewritten when the app is
         created. The icon href goes through the build's base-path placeholder
         rather than a bare slash, so it still resolves when the app is mounted
         under a sub-path. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <title>Chatfuel App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
